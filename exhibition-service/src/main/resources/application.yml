server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: exhibition-service
  datasource:
    url: ${EXHIBITION_DB_URL:jdbc:postgresql://localhost:5432/exhibition}
    username: ${DB_USER:course}
    password: ${DB_PASSWORD:course-dev-only}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

logging:
  level:
    org.springframework.security: DEBUG