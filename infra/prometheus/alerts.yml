groups:
  - name: course-review
    rules:
      - record: course:review_requests:rate1m
        expr: sum(rate(http_server_requests_seconds_count{job="review-service",method="GET",uri="/internal/reviews/{petId}",status=~"2..|5.."}[1m]))
      - record: course:review_errors:rate1m
        expr: sum(rate(http_server_requests_seconds_count{job="review-service",method="GET",uri="/internal/reviews/{petId}",status=~"5.."}[1m])) or (0 * course:review_requests:rate1m)
      - record: course:review_error_ratio:rate1m
        expr: course:review_errors:rate1m / course:review_requests:rate1m
      - record: course:review_requests:increase1m
        expr: sum(increase(http_server_requests_seconds_count{job="review-service",method="GET",uri="/internal/reviews/{petId}",status=~"2..|5.."}[1m]))
      - record: course:review_good_ratio:rate5m
        expr: |
          (sum(rate(http_server_requests_seconds_bucket{job="review-service",method="GET",uri="/internal/reviews/{petId}",status="200",le="0.5"}[5m]))
          or (0 * sum(rate(http_server_requests_seconds_count{job="review-service",method="GET",uri="/internal/reviews/{petId}",status=~"2..|5.."}[5m]))))
          / sum(rate(http_server_requests_seconds_count{job="review-service",method="GET",uri="/internal/reviews/{petId}",status=~"2..|5.."}[5m]))
      - alert: CourseReviewHighErrorRatio
        expr: course:review_error_ratio:rate1m > 0.2 and course:review_requests:increase1m >= 10
        for: 20s
        labels:
          job: review-service
          severity: warning
          team: course
        annotations:
          summary: "Доля 5xx рекомендаций выше 20 процентов"
          description: "Учебное правило: окно 1 минута, не менее 10 запросов, выдержка 20 секунд."
          dashboard_url: "http://localhost:3000/d/course-golden-signals"
          runpet_url: "http://localhost:3000/d/course-golden-signals?viewPanel=9"
      - alert: CourseScrapeTargetDown
        expr: up{job=~"gateway-service|library-service|review-service"} == 0
        for: 30s
        labels:
          severity: warning
          team: course
        annotations:
          summary: "Prometheus не получает метрики {{ $labels.job }}"
          dashboard_url: "http://localhost:3000/d/course-golden-signals"
          runpet_url: "http://localhost:3000/d/course-golden-signals?viewPanel=9"
